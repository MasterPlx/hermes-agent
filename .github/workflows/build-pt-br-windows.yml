name: Build Hermes pt-BR for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - build/pt-br-windows

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Brazilian Portuguese localization
        working-directory: apps/desktop
        run: >-
          npx vitest run
          src/i18n/languages.test.ts
          src/i18n/runtime.test.ts
          src/i18n/context.test.tsx
          src/i18n/pt-br.test.ts
          src/plugins/hermes-bots/i18n.test.ts
          src/plugins/kanban/i18n.test.ts

      - name: Build unsigned Windows installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:nsis -- --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-pt-br-windows-${{ github.sha }}
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
